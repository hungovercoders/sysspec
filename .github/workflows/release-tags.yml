name: release-tags

# Tags only what CI passed: runs when the contracts workflow finishes on a
# push to main, and tags the exact commit it ran on. Tagging is idempotent
# (existing tags are skipped), so running after every green main is safe.
on:
  workflow_run:
    workflows: [contracts]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag:
    # A fork's PR from a branch named main also reports head_branch main;
    # only this repository's own pushes count.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/sysspec-release-tags.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
