# Deploy the sysspec website (website/ — the tool's own docs, distinct from
# the sysspec-demo spec catalog) to Cloudflare on every main push that
# touches it. Same build as the PR previews in site-preview.yml, promoted
# with `wrangler deploy`.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID
# (shared with the demo Worker's workflows).
# Variables (optional overrides): SYSSPEC_DEMO_URL, SYSSPEC_DEMO_MCP_URL,
# SYSSPEC_SITE_URL. The production URLs (sysspec.dev, demo.sysspec.dev) are
# committed in website/src/lib/links.ts and website/astro.config.mjs; these
# exist so a preview deployment can point at itself instead.
name: site-deploy

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site-deploy.yml"
  # First deploy bootstraps the Worker that preview versions target.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Build the website
        run: task site:build
        env:
          SYSSPEC_DEMO_URL: ${{ vars.SYSSPEC_DEMO_URL }}
          SYSSPEC_DEMO_MCP_URL: ${{ vars.SYSSPEC_DEMO_MCP_URL }}
          SYSSPEC_SITE_URL: ${{ vars.SYSSPEC_SITE_URL }}
      - run: npx wrangler deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
