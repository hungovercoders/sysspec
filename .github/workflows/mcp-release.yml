# Cut a sysspec-mcp release: push a tag mcp-v<version> matching
# mcp/package.json. Stages the package on npm via trusted publishing
# (OIDC — no token stored; provenance attached automatically). The staged
# version goes live only after a maintainer approves it with 2FA:
# `npm stage approve sysspec-mcp@<version>` or on npmjs.com.
#
# One-time setup on npmjs.com: publish 1.0.0 manually once so the package
# exists, then add a "trusted publisher" for sysspec-mcp pointing at this
# repository and workflow mcp-release.yml, allowed action: stage publish.
name: mcp-release

on:
  push:
    tags: ["mcp-v[0-9]*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          version=$(node -p "require('./package.json').version")
          [ "$tag" = "$version" ] || { echo "tag mcp-v$tag != mcp version $version"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx vitest run
      - name: Verify the committed dist matches the build
        run: git diff --exit-code -- dist
      - run: npm stage publish
