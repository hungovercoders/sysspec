# Reusable release tagging for a sysspec repo. Publishes each
# service's contract surface as a lightweight git tag <service>/v<version>
# when a merge lands a new manifest version. Lightweight on purpose: the
# tag sha IS the commit sha, so consumers can `git fetch` it directly and
# Renovate digest pinning has nothing to peel. Consumers pull these tags
# via Renovate against their contracts.lock.
#
# Call it only for a commit CI passed - a tag is a promise consumers pin
# to. The scaffolded caller runs on the CI workflow's completion and hands
# over the commit that went green:
#
#   on:
#     workflow_run: { workflows: [ci], types: [completed], branches: [main] }
#   permissions: { contents: write }
#   jobs:
#     tag:
#       if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
#       uses: hungovercoders/sysspec/.github/workflows/sysspec-release-tags.yml@v<major>  # current: v0
#       with:
#         ref: ${{ github.event.workflow_run.head_sha }}
name: sysspec-release-tags

on:
  workflow_call:
    inputs:
      specs-path:
        description: Directory holding the <service>/service.yaml manifests
        type: string
        default: specs
      ref:
        description: The commit to tag (the one CI passed); defaults to the triggering commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Tag each service at its manifest version
        env:
          SPECS_PATH: ${{ inputs.specs-path }}
        run: |
          for manifest in "$SPECS_PATH"/*/service.yaml; do
            service=$(basename "$(dirname "$manifest")")
            version=$(awk '/^version:/{print $2; exit}' "$manifest")
            [ -n "$version" ] || { echo "::warning::$service has no top-level version - not tagged"; continue; }
            tag="$service/v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "exists, skipping: $tag"
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
              echo "created: $tag"
            fi
          done
