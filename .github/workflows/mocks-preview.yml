# Per-PR verification of the demo mocks: the PR's own example suite, run
# first against the served engine and then against the Worker on workerd,
# before a version is uploaded with a stable pr-<number> alias. Uploading a
# version never touches the deployed mocks.
#
# The suite in both cases is the one that runs against the Microcks stack in
# `task ci`, unchanged: a PR proves its mocks agree before main serves them.
#
# This Worker gets no public preview URL - wrangler prints an alias URL for
# the other two Workers in this repo and none for this one, the difference
# being its Durable Object binding - so the verification that matters runs
# on workerd in the job rather than against a hosted alias. The comment
# carries the alias only when wrangler reports one.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID.
name: mocks-preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mocks-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs have no secrets; skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: The served mocks must answer the example suite
        run: task mocks:parity
      - name: Bake the mock bundle the Worker serves
        run: |
          node cli/dist/cli.mjs mocks bundle \
            --out deploy/cloudflare-mocks/src/generated/mocks-bundle.json \
            --source "${{ github.event.pull_request.head.sha }}"
      - run: npm ci --no-audit --no-fund
        working-directory: deploy/cloudflare-mocks
      - name: The Worker itself must serve the example suite
        run: |
          wrangler=deploy/cloudflare-mocks/node_modules/.bin/wrangler
          $wrangler dev -c deploy/cloudflare-mocks/wrangler.jsonc \
            --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          dev=$!
          trap 'kill $dev 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/health >/dev/null || {
            echo "wrangler dev never came up:"; cat "$RUNNER_TEMP/wrangler-dev.log"; exit 1;
          }
          # workerd runs the same engine the Worker will serve in production,
          # Durable Object event channels included.
          node cli/dist/cli.mjs mocks test \
            --microcks-url http://127.0.0.1:8787 \
            --async-minion-url http://127.0.0.1:8787
      - name: Upload a preview version aliased to this PR
        id: upload
        working-directory: deploy/cloudflare-mocks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          upload() { npx wrangler versions upload --preview-alias "$ALIAS" 2>&1 | tee upload.log; }
          if ! upload; then
            if grep -q 'cannot upload a new version of a Worker that does not yet exist' upload.log; then
              echo "Worker not deployed yet; bootstrapping with wrangler deploy first."
              npx wrangler deploy 2>&1 | tee deploy.log
              upload
            else
              exit 1
            fi
          fi
          # Anchored on the alias, so a bare sysspec-mocks hostname can
          # never be mistaken for this PR's preview. Empty is expected
          # here: this Worker gets no alias URL (see the header), and the
          # version upload is still worth running because it is the real
          # upload path main takes.
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          echo "preview alias: ${url:-none reported by wrangler}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the preview URL as a sticky comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- mocks-preview -->';
            const url = process.env.PREVIEW_URL;
            const where = url
              ? `- Preview: ${url} (the index lists every REST and event URL)`
              : '- No public preview URL: this Worker carries a Durable Object binding ' +
                'and wrangler reports no alias for it. The uploaded version is in the ' +
                'dashboard, and the live mocks are the ones main deploys.';
            const body = `${marker}\n**Mock preview** (this PR's contracts and examples, served)\n\n` +
              `${where}\n\n` +
              `This PR's example suite passed against the served engine and against ` +
              `the Worker on workerd, both run by \`sysspec mocks test\`. ` +
              `Updated on every push.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
