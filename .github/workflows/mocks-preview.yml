# Per-PR preview of the demo mocks, uploaded as a Worker version with a
# stable pr-<number> preview alias, then held to this PR's own example
# suite. Uploading a version never touches the deployed mocks.
#
# The suite that runs against the preview is the one that runs against the
# Microcks stack in `task ci`, unchanged: a PR proves its mocks agree
# before main ever serves them.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID.
name: mocks-preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mocks-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs have no secrets; skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: The served mocks must answer the example suite
        run: task mocks:parity
      - name: Bake the mock bundle the Worker serves
        run: |
          node cli/dist/cli.mjs mocks bundle \
            --out deploy/cloudflare-mocks/src/generated/mocks-bundle.json \
            --source "${{ github.event.pull_request.head.sha }}"
      - run: npm ci --no-audit --no-fund
        working-directory: deploy/cloudflare-mocks
      - name: Upload a preview version aliased to this PR
        id: upload
        working-directory: deploy/cloudflare-mocks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          upload() { npx wrangler versions upload --preview-alias "$ALIAS" 2>&1 | tee upload.log; }
          if ! upload; then
            if grep -q 'cannot upload a new version of a Worker that does not yet exist' upload.log; then
              echo "Worker not deployed yet; bootstrapping with wrangler deploy first."
              npx wrangler deploy 2>&1 | tee deploy.log
              upload
            else
              exit 1
            fi
          fi
          # Anchored on the alias: a bare sysspec-mocks.*.workers.dev line
          # must never be mistaken for this PR's preview.
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          # On the Worker's first upload, right after the bootstrap deploy,
          # wrangler prints no alias URL. The alias is deterministic
          # (<alias>-<worker>.<subdomain>.workers.dev), so derive it from the
          # workers.dev hostname the deploy printed; the next step proves
          # whichever URL this lands on by calling it.
          if [ -z "$url" ] && [ -f deploy.log ]; then
            host=$(grep -oE 'https://sysspec-mocks\.[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
            url=$(printf '%s' "$host" | sed "s#https://sysspec-mocks\.#https://$ALIAS-sysspec-mocks.#")
          fi
          [ -n "$url" ] || { echo "no preview URL in wrangler output"; exit 1; }
          echo "preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Hold the preview to this PR's example suite
        run: |
          url="${{ steps.upload.outputs.url }}"
          # A freshly uploaded version takes a moment to answer on its alias.
          for _ in $(seq 1 30); do
            curl -sf "$url/health" >/dev/null && break
            sleep 2
          done
          curl -sf "$url/health" >/dev/null || {
            echo "$url never answered /health - the preview alias may not exist."
            echo "Check whether preview URLs are enabled for this Worker."
            exit 1
          }
          node cli/dist/cli.mjs mocks test --microcks-url "$url" --async-minion-url "$url"
      - name: Post the preview URL as a sticky comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- mocks-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n**Mock preview** (this PR's contracts and examples, served)\n\n` +
              `- Index: ${url}\n- REST and event URLs are listed there\n\n` +
              `Held to this PR's example suite by \`sysspec mocks test\`. ` +
              `Updated on every push; the alias is stable for this PR.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
