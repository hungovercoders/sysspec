# Reusable GitHub Pages deploy for a sysspec repo's generated docs.
#
# Consumers (the caller must grant the permissions):
#   permissions: { contents: read, pages: write, id-token: write }
#   jobs:
#     deploy:
#       uses: hungovercoders/sysspec/.github/workflows/sysspec-pages.yml@v<major>  # current: v0
name: sysspec-pages

on:
  workflow_call:
    inputs:
      docs-task:
        description: The task target that builds the site
        type: string
        default: docs:build
      site-dir:
        description: Directory the site is built into
        type: string
        default: site

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the generated changelog pages read the
          # <service>/v<version> release tags, absent in a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: task ${{ inputs.docs-task }}
        env:
          DOCS_TASK: ${{ inputs.docs-task }}
        run: task $DOCS_TASK
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.site-dir }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
