# Reusable GitHub Pages deploy for a sysspec repo's generated docs.
#
# Consumers (the caller must grant the permissions):
#   permissions: { contents: read, pages: write, id-token: write }
#   jobs:
#     deploy:
#       uses: hungovercoders/sysspec/.github/workflows/sysspec-pages.yml@v<major>  # current: v0
name: sysspec-pages

on:
  workflow_call:
    inputs:
      docs-task:
        description: The task target that builds the site
        type: string
        default: docs:build
      site-dir:
        description: Directory the site is built into
        type: string
        default: site

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and tags: the generated changelog pages read the
          # <service>/v<version> release tags, absent in a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: task ${{ inputs.docs-task }}
        env:
          DOCS_TASK: ${{ inputs.docs-task }}
        run: task $DOCS_TASK
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ inputs.site-dir }}
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
