# Reusable CI for a sysspec repo: pinned toolchain via mise, then
# the same task developers and agents run locally. The version gate inside
# it is the teeth: a quiet amendment to a gated contract cannot land
# silently.
#
# Consumers:
#   jobs:
#     ci:
#       uses: hungovercoders/sysspec/.github/workflows/sysspec-ci.yml@v<major>  # current: v0
name: sysspec-ci

on:
  workflow_call:
    inputs:
      task-command:
        description: The task target to run
        type: string
        default: ci
      allow-missing-base:
        description: Let the diff gates skip when the base ref is missing (normally a failure in CI)
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: task ${{ inputs.task-command }}
        env:
          # The diff gates' base: the PR's base branch, or on a push the
          # repository's default branch - which need not be main.
          SYSSPEC_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          SYSSPEC_ALLOW_MISSING_BASE: ${{ inputs.allow-missing-base && '1' || '' }}
