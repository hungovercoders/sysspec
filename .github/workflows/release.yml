# Cut a sysspec release: push a tag v<version> matching cli/package.json.
# Stages the package on npm via trusted publishing (OIDC — no token
# stored; provenance attached automatically) and moves the floating
# v<major> tag that adopter workflows reference (uses: ...@v<major>).
# The staged version goes live only after a maintainer approves it with
# 2FA: `npm stage approve sysspec@<version>` or on npmjs.com.
#
# Two jobs, so the write token never meets third-party code: the build
# job (checkout, mise, npm) holds only read and id-token; the tag job
# holds contents: write and runs nothing but git. The major tag moves
# only once staging has succeeded - approval on npm is still a separate,
# human step, so approve promptly after a release.
#
# One-time setup on npmjs.com: publish the first version manually so the
# package exists, then add a "trusted publisher" for sysspec pointing at
# this repository and workflow release.yml, allowed action: stage publish.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Verify the tag matches the package version
        working-directory: cli
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          [ "$tag" = "$version" ] || { echo "tag v$tag != cli version $version"; exit 1; }
      - run: npm ci --no-audit --no-fund
        working-directory: cli
      - run: npm run build
        working-directory: cli
      - run: npx vitest run
        working-directory: cli
      - name: Verify the committed dist matches the build
        run: git diff --exit-code -- cli/dist
      - run: npm stage publish
        working-directory: cli

  move-major-tag:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Move the floating major tag
        run: |
          major="v$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1)"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
