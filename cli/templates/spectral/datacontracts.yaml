# Naming ruleset for ODCS data contracts.
#
# datacontract-cli's `lint` validates a contract against the ODCS schema and
# has no hook for house rules, so the naming half of the gate is Spectral -
# it lints any YAML document, not just OpenAPI/AsyncAPI. `sysspec lint
# datacontracts` runs both: datacontract-cli for structure, this for names.
#
# Same convention as the specs: attributes and their controlled values are
# lower_snake_case. Contract metadata is not an attribute - `id`, `name`,
# `domain` and `tenant` keep whatever the catalogue uses. Neither are the
# deliberately human parts ODCS 3.2 adds: a `synonym` is the business
# phrase ("settlement amount"), and enum `label`s are for display.
#
# A repo overrides this wholesale by putting its own
# `.spectral-datacontracts.yaml` at its root.
rules:
  datacontract-object-names-snake-case:
    description: Schema object names are lower_snake_case.
    message: 'schema object "{{value}}" is not lower_snake_case'
    severity: error
    given:
      - $.schema[*].name
    then:
      function: casing
      functionOptions:
        type: snake

  datacontract-physical-names-snake-case:
    description: Physical names (tables, columns) are lower_snake_case.
    message: 'physicalName "{{value}}" is not lower_snake_case'
    severity: error
    given:
      - $..physicalName
    then:
      function: casing
      functionOptions:
        type: snake

  datacontract-property-names-snake-case:
    description: Property names are lower_snake_case, nested ones included.
    message: 'property "{{value}}" is not lower_snake_case'
    severity: error
    given:
      - $..properties[*].name
    then:
      function: casing
      functionOptions:
        type: snake

  datacontract-no-deprecated-shapes:
    description: The shapes ODCS deprecated are not used.
    message: '{{property}} is a pre-3.1 shape - use the team object, and let id/name carry the data product'
    severity: error
    given:
      # Valid but deprecated, so neither the JSON Schema nor
      # datacontract-cli will tell you: `dataProduct` went in 3.1, and the
      # array form of `team` goes in ODCS 4.0.
      - $.dataProduct
    then:
      function: undefined

  datacontract-team-is-an-object:
    description: team is the 3.1+ object with members, not the 3.0 array.
    message: 'team must be an object with members[], not an array'
    severity: error
    given:
      - $.team
    then:
      function: schema
      functionOptions:
        schema:
          type: object

  datacontract-enum-values-snake-case:
    description: Controlled vocabularies are lower_snake_case.
    message: 'enum value "{{value}}" is not lower_snake_case'
    severity: error
    given:
      # ODCS 3.2 made enums first class; a vocabulary smuggled through a
      # quality rule is still held to the same convention.
      - $..enum[*].value
      - $..validValues[*]
    then:
      function: casing
      functionOptions:
        type: snake
