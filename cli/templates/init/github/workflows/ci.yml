name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: __SYSSPEC_REPO_SLUG__/.github/workflows/sysspec-ci.yml@__KIT_MAJOR__
