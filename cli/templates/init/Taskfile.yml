version: "3"

vars:
  # The machinery pin - Renovate bumps this (npm datasource).
  SYSSPEC: sysspec@__KIT_VERSION__

tasks:
  setup:
    desc: One-shot onboarding - install the pinned toolchain and the pre-commit hook
    cmds:
      - mise install
      - git config core.hooksPath .githooks

  ci:
    desc: Full verification - identical locally and in CI
    cmds:
      - defer: { task: mocks:down }
      - task: lint
      - task: check
      - task: contract:test
      - task: mocks:test

  check:
    desc: Diff gates and the docs build
    cmds:
      - task: check:version
      - task: check:compat
      - task: check:intent
      - task: docs:build
      - task: docs:diagrams

  check:version:
    desc: Gated artifacts must bump their manifest versions when they change
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        npx -y {{.SYSSPEC}} check version --base "origin/${GITHUB_BASE_REF:-main}"

  check:compat:
    desc: Breaking contract changes must carry a major version bump
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        npx -y {{.SYSSPEC}} check compat --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  check:intent:
    desc: Added schema elements must be named in the service's features
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        npx -y {{.SYSSPEC}} check intent --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:
    desc: Lint specs, features, data contracts and manifests (scope with SERVICE=)
    cmds:
      - task: lint:specs
      - task: lint:features
      - task: lint:datacontracts
      - task: lint:manifest

  lint:specs:
    cmds:
      - npx -y {{.SYSSPEC}} lint specs {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:features:
    cmds:
      - npx -y {{.SYSSPEC}} lint features {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:datacontracts:
    cmds:
      - npx -y {{.SYSSPEC}} lint datacontracts {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:manifest:
    cmds:
      - npx -y {{.SYSSPEC}} lint manifest {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  docs:generate:
    desc: Emit the spec data the docs site renders from
    run: once
    cmds:
      - npx -y {{.SYSSPEC}} docs data

  docs:diagrams:
    desc: Every mermaid diagram the docs site renders must parse (mermaid-cli)
    deps: [docs:generate]
    cmds:
      - npx -y {{.SYSSPEC}} docs diagrams

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:generate]
    dir: docs-site
    cmds:
      - |
        if [ -n "$CI" ]; then npm ci; else npm install; fi
      - npm run build

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:generate]
    dir: docs-site
    cmds:
      - npm install
      - npm run dev

  mocks:up:
    desc: Start the Microcks mock stack
    run: once
    cmds:
      - npx -y {{.SYSSPEC}} mocks up

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - npx -y {{.SYSSPEC}} mocks down

  mocks:load:
    desc: Load every service's contracts and examples into Microcks (scope with SERVICE=)
    run: once
    cmds:
      - npx -y {{.SYSSPEC}} mocks load {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  mocks:watch:
    desc: 'Watch a mock event channel (CHANNEL=<Title>/<version>/<operation>)'
    cmds:
      - npx -y {{.SYSSPEC}} mocks watch --channel {{.CHANNEL}}

  contract:test:
    desc: Hold a real implementation (REST_ENDPOINT/ASYNC_ENDPOINT) - or, with no overrides, the mocks - to the contracts
    run: once
    deps: [mocks:load]
    cmds:
      - npx -y {{.SYSSPEC}} contract test {{if .SERVICE}}--service {{.SERVICE}}{{end}} {{if .REST_ENDPOINT}}--rest-endpoint {{.REST_ENDPOINT}}{{end}} {{if .ASYNC_ENDPOINT}}--async-endpoint {{.ASYNC_ENDPOINT}}{{end}}

  mocks:test:
    desc: Smoke-test the HTTP and event mocks against the example files
    deps: [mocks:load]
    cmds:
      - npx -y {{.SYSSPEC}} mocks test {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  null:run:
    desc: 'Falsifiability gate - run a bound feature suite against the null service; red unless zero scenarios pass (task null:run RESULTS=<file> -- <suite cmd>)'
    cmds:
      - npx -y {{.SYSSPEC}} null run {{if .PORT}}--port {{.PORT}}{{end}} --results {{.RESULTS}} -- {{.CLI_ARGS}}
