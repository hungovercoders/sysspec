version: "3"

tasks:
  setup:
    desc: One-shot onboarding - install the pinned toolchain and git hooks
    cmds:
      - mise install
      - git config core.hooksPath .githooks

  check:
    desc: Fast checks (pre-commit tier) - branch name, lint, gated version gate, docs build
    cmds:
      - task: check:branch
      - task: lint
      - task: check:version
      - task: check:plugin
      - task: check:cli
      - task: test:cli
      - task: check:cli:dist
      - task: check:mcp
      - task: test:mcp
      - task: check:mcp:dist
      - task: docs:build
      - task: docs:diagrams

  check:plugin:
    desc: Plugin surface changes (cli, mcp, skills, manifests) must bump the plugin version
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        node {{.ROOT_DIR}}/cli/dist/cli.mjs check surface --base "origin/${GITHUB_BASE_REF:-main}" \
          --version-file .claude-plugin/plugin.json --paths cli/,mcp/,skills/,.claude-plugin/,.mcp.json

  check:cli:
    desc: Changes under cli/ must bump the sysspec package version
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        node {{.ROOT_DIR}}/cli/dist/cli.mjs check surface --base "origin/${GITHUB_BASE_REF:-main}" \
          --version-file cli/package.json --json-key version --paths cli/

  test:cli:
    desc: Unit + golden tests for the sysspec CLI
    dir: cli
    cmds:
      - if [ -n "$CI" ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - npx vitest run

  check:cli:dist:
    desc: The committed CLI bundle must match the source (Taskfile and plugin run it directly)
    dir: cli
    cmds:
      - npm run build --silent
      - git diff --exit-code -- dist || { echo "cli/dist is stale - run 'npm run build' in cli/ and commit"; exit 1; }

  check:mcp:
    desc: Changes under mcp/ must bump the sysspec-mcp package version
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        node {{.ROOT_DIR}}/cli/dist/cli.mjs check surface --base "origin/${GITHUB_BASE_REF:-main}" \
          --version-file mcp/package.json --json-key version --paths mcp/

  test:mcp:
    desc: Unit + e2e tests for the MCP server (both spec sources, stdio, http)
    dir: mcp
    cmds:
      - if [ -n "$CI" ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - npx vitest run

  check:mcp:dist:
    desc: The committed dist bundle must match the source (plugin runs it directly)
    dir: mcp
    cmds:
      - npm run build --silent
      - git diff --exit-code -- dist || { echo "mcp/dist is stale - run 'npm run build' in mcp/ and commit"; exit 1; }

  check:branch:
    desc: Branch name must be main, match the Linear convention (user/gri-123-slug), or be an agent branch (claude/slug)
    cmds:
      - |
        branch="${GITHUB_HEAD_REF:-$(git branch --show-current)}"
        if [ -z "$branch" ]; then echo "detached HEAD - skipping branch check"; exit 0; fi
        echo "$branch" | grep -qE '^main$|^[A-Za-z0-9._-]+/gri-[0-9]+(-[a-z0-9-]+)*$|^claude/[A-Za-z0-9._-]+$' \
          || { echo "branch '$branch' does not match Linear convention <user>/gri-<number>-<slug> (or agent convention claude/<slug>)"; exit 1; }
        echo "branch ok: $branch"

  check:commit:
    desc: Validate a single commit message file (commit-msg hook) against conventional commits
    cmds:
      - |
        head -1 "$MSG_FILE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' \
          || { echo "commit message is not a conventional commit (feat:, fix:, docs:, chore:, ...)"; exit 1; }

  check:commits:
    desc: Validate all commit messages ahead of origin/main against conventional commits
    cmds:
      - |
        if [ "$(git branch --show-current)" = "main" ] && [ -z "$GITHUB_HEAD_REF" ]; then echo "on main - skipping range check"; exit 0; fi
        git fetch -q origin main 2>/dev/null || true
        bad=$(git log origin/main..HEAD --format='%s' | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' || true)
        [ -z "$bad" ] || { echo "non-conventional commit messages:"; echo "$bad"; exit 1; }
        echo "commit messages ok ($(git log origin/main..HEAD --oneline | wc -l | tr -d ' ') checked)"

  check:version:
    desc: Gated artifacts (contracts, features) must bump their manifest version when they change
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        node {{.ROOT_DIR}}/cli/dist/cli.mjs check version --base "origin/${GITHUB_BASE_REF:-main}"

  docs:generate:
    desc: Emit the spec data the docs site renders from
    run: once
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs docs data

  docs:diagrams:
    desc: Every mermaid diagram in the generated docs must parse (mermaid-cli)
    deps: [docs:generate]
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs docs diagrams

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:generate]
    # dir, not npm --prefix: through the docs-site symlink, --prefix makes
    # npm rewrite the lockfile with physical ../cli/... package paths.
    dir: docs-site
    env:
      # docs-site is a symlink into the CLI package templates; without the
      # override astro would resolve ../site against the physical path.
      DOCS_SITE_OUT: "{{.ROOT_DIR}}/site"
    cmds:
      - |
        if [ -n "$CI" ]; then npm ci; else npm install; fi
      - npm run build

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:generate]
    dir: docs-site
    env:
      DOCS_SITE_OUT: "{{.ROOT_DIR}}/site"
    cmds:
      - npm install
      - npm run dev

  check:compat:
    desc: Breaking contract changes vs origin/main must carry a major version bump
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        node {{.ROOT_DIR}}/cli/dist/cli.mjs check compat --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  check:intent:
    desc: Added schema elements vs origin/main must be named in the service's features
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        node {{.ROOT_DIR}}/cli/dist/cli.mjs check intent --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  ci:
    desc: Full verification - identical locally and in CI
    cmds:
      - defer: { task: mocks:down }
      - task: check
      - task: check:commits
      - task: check:compat
      - task: check:intent
      - task: check:init
      - task: check:null
      - task: mocks:load
      - task: contract:test
      - task: mocks:test

  check:init:
    desc: The init scaffold must pass its own gates
    cmds:
      - |
        tmp=$(mktemp -d)
        sysspec="node {{.ROOT_DIR}}/cli/dist/cli.mjs"
        $sysspec init "$tmp" --org com.example
        cd "$tmp"
        git init -q . && git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm "chore: scaffold"
        $sysspec lint specs
        $sysspec lint features
        $sysspec lint datacontracts
        $sysspec lint manifest
        $sysspec check version
        $sysspec docs data
        $sysspec docs diagrams
        cd / && rm -rf "$tmp"

  check:null:
    desc: Self-test the falsifiability gate - a hollow suite must go red, an all-failing one green
    cmds:
      - |
        tmp=$(mktemp -d)
        cat > "$tmp/hollow.json" <<'EOF'
        [{"uri":"features/hollow.feature","elements":[{"type":"scenario","name":"empty stub passes","line":3,"steps":[{"result":{"status":"passed"}}]}]}]
        EOF
        cat > "$tmp/honest.json" <<'EOF'
        [{"uri":"features/honest.feature","elements":[{"type":"scenario","name":"real assertion fails","line":3,"steps":[{"result":{"status":"failed"}}]}]}]
        EOF
        if node {{.ROOT_DIR}}/cli/dist/cli.mjs null run --port 9909 --results "$tmp/r.json" -- cp "$tmp/hollow.json" "$tmp/r.json"; then
          echo "check:null: a fully-passing suite was NOT flagged"; exit 1
        fi
        node {{.ROOT_DIR}}/cli/dist/cli.mjs null run --port 9909 --results "$tmp/r.json" -- \
          sh -c "curl -fsS -X PATCH -d probe http://127.0.0.1:9909/any/path | grep -qx '{}' && cp '$tmp/honest.json' '$tmp/r.json' && exit 1"
        rm -rf "$tmp"

  mocks:up:
    desc: Start the Microcks mock stack
    run: once
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs mocks up

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs mocks down

  mocks:load:
    desc: Load every service's contracts and examples into Microcks (scope with SERVICE=)
    run: once
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs mocks load {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  mocks:watch:
    desc: 'Watch a mock event channel (CHANNEL=Orders/2.1.0/publishOrderPlaced)'
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs mocks watch --channel {{.CHANNEL}}

  contract:test:
    desc: Hold a real implementation (REST_ENDPOINT/ASYNC_ENDPOINT) - or, with no overrides, the mocks - to the contracts
    run: once
    deps: [mocks:load]
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs contract test {{if .SERVICE}}--service {{.SERVICE}}{{end}} {{if .REST_ENDPOINT}}--rest-endpoint {{.REST_ENDPOINT}}{{end}} {{if .ASYNC_ENDPOINT}}--async-endpoint {{.ASYNC_ENDPOINT}}{{end}}

  mocks:test:
    desc: Smoke-test the HTTP and event mocks against the example files
    deps: [mocks:load]
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs mocks test {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  null:run:
    desc: 'Falsifiability gate - run a bound feature suite against the null service; red unless zero scenarios pass (task null:run RESULTS=<file> -- <suite cmd>)'
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs null run {{if .PORT}}--port {{.PORT}}{{end}} --results {{.RESULTS}} -- {{.CLI_ARGS}}

  lint:
    desc: Lint specs, feature files, data contracts and manifests (scope with SERVICE=<name>)
    cmds:
      - task: lint:specs
      - task: lint:features
      - task: lint:datacontracts
      - task: lint:manifest

  lint:specs:
    desc: Spectral-lint the OpenAPI and AsyncAPI contracts
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs lint specs {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:features:
    desc: Lint the Gherkin acceptance criteria
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs lint features {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:datacontracts:
    desc: Lint the ODCS data contracts with datacontract-cli
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs lint datacontracts {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:manifest:
    desc: Cross-check manifests against contracts and the spec graph
    cmds:
      - node {{.ROOT_DIR}}/cli/dist/cli.mjs lint manifest {{if .SERVICE}}--service {{.SERVICE}}{{end}}
