apiVersion: v3.2.0
kind: DataContract
id: orders-events-history
name: Order events history
version: 1.3.0
status: active
domain: Commerce
tenant: hungovercoders
description:
  purpose: >
    Append-only historical record of the Order aggregate's events. One row
    per event, mirroring the AsyncAPI payloads on orders.placed.v2 and
    orders.cancelled.v2 field for field - the stream is ephemeral, this
    table is the record.
  usage: >
    Order lifecycle analytics, audit, and replay/backfill for downstream
    consumers that joined after the fact. Not a source for current order
    state - use the orders service API for that.
  limitations: >
    Delivery upstream is at-least-once; rows are deduplicated on the
    CloudEvents envelope id, so exactly one row per event. Events land
    within minutes but ordering across event types is only guaranteed per
    order_id.

# What a reader - human or agent - needs to know before querying this
# record. Same authority as the rest of the contract: it is versioned and
# gated, not advice bolted on afterwards.
context:
  instructions: >
    This is the event history of the Order aggregate, one row per event,
    never updated in place. Count orders from order_placed_events and treat
    order_cancelled_events as a separate fact joined on order_id; an order
    can appear in both. Money is always integer pence in total_pence -
    never divide before aggregating.
  verifiedStatements:
    - question: How many orders were placed on a given day?
      answer: >
        Count rows in order_placed_events where placed_at falls in the day,
        in the placed_at timezone. The table is deduplicated on event_id, so
        no DISTINCT is needed.
    - question: What proportion of orders are cancelled, and why?
      answer: >
        Join order_cancelled_events to order_placed_events on order_id and
        group by reason. reason is a closed vocabulary of three values.
    - question: What is the value of an order?
      answer: >
        total_pence, an integer number of pence covering the whole order.
        There is no per-line breakdown in this record.
  constraints:
    - constraint: >
        Never present this as current order state. An order cancelled after
        the last event you read still reads as placed here; the orders
        service API is the source for current state.
    - constraint: >
        Never treat a missing order_cancelled_events row as proof an order
        was fulfilled - it only means no cancellation event has landed.

schema:
  # `id` is what a fully qualified reference resolves against, so the
  # elements other contracts point at carry one; the rest do not need it.
  - id: order_placed_events
    name: order_placed_events
    logicalType: object
    physicalName: order_placed_events
    physicalType: table
    description: One row per OrderPlaced event on orders.placed.v2.
    properties:
      - name: event_id
        logicalType: string
        physicalType: uuid
        required: true
        unique: true
        primaryKey: true
        description: CloudEvents envelope id - the dedupe key.
      - name: event_type
        logicalType: string
        physicalType: text
        required: true
        description: CloudEvents type, e.g. com.hungovercoders.orders.placed.v2.
      - name: event_source
        logicalType: string
        physicalType: text
        required: true
        description: CloudEvents source of the producing service.
      - name: event_time
        logicalType: date
        physicalType: timestamp
        required: true
        description: CloudEvents envelope time.
      - id: order_id
        name: order_id
        logicalType: string
        physicalType: uuid
        required: true
        unique: true
      - name: customer_id
        logicalType: string
        physicalType: uuid
        required: true
      - name: placed_at
        logicalType: date
        physicalType: timestamp
        required: true
        partitioned: true
        semanticType: dimension
        synonyms:
          - synonym: order date
      - name: total_pence
        logicalType: integer
        physicalType: bigint
        required: true
        description: Order value in whole pence, the whole order.
        synonyms:
          - synonym: order value
            description: What the business calls this when reporting revenue.
        quality:
          - type: sql
            description: Order totals are never negative.
            dimension: conformity
            query: SELECT COUNT(*) FROM order_placed_events WHERE total_pence < 0
            mustBe: 0

  - name: order_cancelled_events
    logicalType: object
    physicalName: order_cancelled_events
    physicalType: table
    description: One row per OrderCancelled event on orders.cancelled.v2.
    # Declared, not inferred: a cancellation always refers to an order this
    # record already carries. The catalog draws the ER edge from this.
    relationships:
      - id: cancellation_of_order
        from: order_cancelled_events.order_id
        to: order_placed_events.order_id
    properties:
      - name: event_id
        logicalType: string
        physicalType: uuid
        required: true
        unique: true
        primaryKey: true
        description: CloudEvents envelope id - the dedupe key.
      - name: event_type
        logicalType: string
        physicalType: text
        required: true
        description: CloudEvents type, e.g. com.hungovercoders.orders.cancelled.v2.
      - name: event_source
        logicalType: string
        physicalType: text
        required: true
        description: CloudEvents source of the producing service.
      - name: event_time
        logicalType: date
        physicalType: timestamp
        required: true
        description: CloudEvents envelope time.
      - name: order_id
        logicalType: string
        physicalType: uuid
        required: true
        unique: true
      - name: cancelled_at
        logicalType: date
        physicalType: timestamp
        required: true
        partitioned: true
        semanticType: dimension
      - name: reason
        logicalType: string
        physicalType: text
        required: true
        description: Why the order was cancelled - a closed vocabulary.
        # The same three values the AsyncAPI payload enumerates. First-class
        # here since ODCS 3.2, so the vocabulary is data rather than prose
        # inside a quality rule - and each value carries what it means.
        enum:
          - value: customer_request
            label: Customer request
            description: The customer asked for the order to be cancelled.
          - value: payment_failed
            label: Payment failed
            description: No payment settled for the order inside the window.
          - value: out_of_stock
            label: Out of stock
            description: The order could not be fulfilled from available stock.
        quality:
          - metric: invalidValues
            description: Every reason is one of the declared values.
            dimension: conformity
            mustBe: 0

slaProperties:
  - property: latency
    value: 15
    unit: m

team:
  name: Commerce
  description: Owns the Order aggregate and everything published from it.
  members:
    - username: team-commerce
      role: owner

support:
  - channel: '#orders-support'
    tool: slack
