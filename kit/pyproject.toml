[project]
name = "sysspec"
version = "1.0.0"
description = "System specs first: enforceable system intent (contracts + gherkin) with deterministic gates, generated docs and mocks. The MCP server ships separately as sysspec-mcp on npm."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "websockets>=13.0",
    "jsonschema>=4.0",
]

[project.scripts]
sysspec = "sysspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "src/sysspec/data/init/docs-site/node_modules",
    "src/sysspec/data/init/docs-site/.astro",
    "src/sysspec/data/init/docs-site/src/data/specs.json",
    "src/sysspec/data/init/docs-site/public/specs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sysspec"]
